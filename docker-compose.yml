# Base de développement / auto-hébergement : PostgreSQL + TimescaleDB + PostGIS
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: mobalplus
      POSTGRES_PASSWORD: mobalplus
      POSTGRES_DB: mobalplus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    restart: unless-stopped

volumes:
  pgdata:
