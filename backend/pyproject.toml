[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobalplus"
version = "0.1.0"
description = "Collecte et historisation des capteurs Mobile Alerts"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "psycopg[binary]>=3.1",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "tzdata",  # base des fuseaux horaires sous Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mobalplus = "mobalplus.cli:main"

[tool.setuptools.packages.find]
include = ["mobalplus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
