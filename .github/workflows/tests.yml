name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobalplus
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mobalplus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests Python (migrations, import, collecteur)
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests TypeScript (Edge Function)
        working-directory: supabase
        run: |
          npm ci
          npm test

      - name: Vérification et build de la PWA
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
